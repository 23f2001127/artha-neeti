# Render Blueprint for the ArthaNeeti API. On Render: New > Blueprint, then
# choose this repository. Secrets (sync: false) are entered in the Render
# dashboard, never committed. Deployment steps are in README.md.
services:
  - type: web
    name: arthaneeti-api
    runtime: docker
    plan: free
    dockerfilePath: ./docker/backend.Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      # Required; the same values as your local .env.
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # The deployed web app's URL (comma-separated for more than one).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Protect the shared free-tier LLM quota on a public URL (see app/README.md).
      - key: MAX_DAILY_JOBS
        value: "15"
      - key: IP_THROTTLE_PER_MINUTE
        value: "6"
      # One specialist agent at a time: each runs its own MCP server process,
      # and two at once can exceed the free plan's 512 MB.
      - key: PLANNER_MAX_CONCURRENCY
        value: "1"
