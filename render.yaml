# Render Blueprint for the ArthaNeeti backend (FastAPI). Deploy: connect this
# repo on Render and it reads this file automatically ("New +" -> "Blueprint").
# Secrets (marked sync: false) are never stored here - paste them into
# Render's own dashboard after the first deploy. See README.md's "Deploying"
# section for the full walkthrough.
services:
  - type: web
    name: arthaneeti-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Required - paste the real values in Render's dashboard (Environment
      # tab), never here. Same keys as the local .env.example.
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # Set once the frontend's real deployed URL is known (step 4 of the
      # deployment walkthrough in README.md) - comma-separated if more than
      # one origin (e.g. a Vercel preview URL you also want to allow).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Deployment-only safety limits (app/main.py) - protect the shared
      # free-tier LLM quota from a public URL getting hammered. Sensible
      # defaults; tune if needed, see app/README.md.
      - key: MAX_DAILY_JOBS
        value: "15"
      - key: IP_THROTTLE_PER_MINUTE
        value: "6"
